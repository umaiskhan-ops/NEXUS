name: NEXUS Sovereign Mesh CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install core and QLoRA plumbing dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "torch>=2.4.0" --index-url https://download.pytorch.org/whl/cpu || pip install "torch>=2.4.0"
        pip install "transformers>=4.44.0" "peft>=0.12.0" "trl>=0.9.0" "accelerate>=0.33.0" "safetensors>=0.4.3" "datasets>=2.20.0"

    - name: Cache HuggingFace ONNX Models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: ${{ runner.os }}-hf-onnx-models-v1-${{ hashFiles('scripts/download_models.py') }}
        restore-keys: |
          ${{ runner.os }}-hf-onnx-models-v1-

    - name: Download & Attest Neural Consensus Models (MiniLM & DeBERTa)
      run: |
        python scripts/download_models.py

    - name: Run HF PEFT QLoRA tiny model plumbing test
      run: |
        python -m unittest discover -s tests -p "test_continuous_learning.py" -k "test_10_hf_peft_qlora_tiny_model_plumbing" -v

    - name: Run Neural Semantic Consensus Benchmark Suite
      run: |
        python -m unittest discover -s tests -p "test_consensus_eval.py" -v

    - name: Run full unit test suite
      run: |
        python -m unittest discover -s tests
